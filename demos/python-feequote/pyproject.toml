[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feequote"
version = "0.1.0"
description = "Fee quoting for customer payment transfers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16", "mypy>=2.0"]

[tool.setuptools.packages.find]
include = ["feequote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["feequote"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
